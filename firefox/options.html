<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandma Guard detection history</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <main class="options-shell" aria-labelledby="history-title">
    <header>
      <div>
        <p class="eyebrow">Grandma Guard</p>
        <h1 id="history-title">Scareware detection history</h1>
        <p>Only suspicious hostnames and matched reasons are kept locally. Normal browsing history is not recorded or transmitted. Clearing history also removes pending one-time exceptions.</p>
      </div>
      <button id="clearHistory" class="secondary" type="button">Clear history</button>
    </header>
    <div id="emptyState" class="empty">No suspicious pages have been stopped.</div>
    <div id="events" class="events" aria-live="polite"></div>
    <p id="historyStatus" class="visually-hidden" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
